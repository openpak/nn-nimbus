name: ci

# Builds the app and plugin on a manual run (release.yml builds them for a vX.Y.Z tag).
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f docker/tools.Dockerfile -t builder .
      - run: docker run --rm -v "$PWD":/src builder bash /src/docker/build-inner.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nn-nimbus
          path: |
            app/nimbus.cia
            app/nimbus.3dsx
            plugin/plugin.3gx
          retention-days: 3
